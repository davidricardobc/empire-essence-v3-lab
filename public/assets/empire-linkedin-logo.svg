<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">Empire Essence logo</title>
  <desc id="desc">A premium square monogram logo with gold EE letters on a deep black background.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#1b1510"/>
      <stop offset="56%" stop-color="#0d0b0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="18%" y1="10%" x2="82%" y2="90%">
      <stop offset="0%" stop-color="#f4ddb0"/>
      <stop offset="45%" stop-color="#c9a361"/>
      <stop offset="100%" stop-color="#8f6d31"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#bg)"/>
  <rect x="27" y="27" width="246" height="246" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <rect x="41" y="41" width="218" height="218" fill="none" stroke="#5f4724" stroke-width="1.5" opacity=".62"/>
  <text
    x="150"
    y="182"
    text-anchor="middle"
    font-family="Georgia, 'DejaVu Serif', serif"
    font-size="122"
    font-weight="700"
    letter-spacing="2"
    fill="url(#gold)">EE</text>
</svg>
